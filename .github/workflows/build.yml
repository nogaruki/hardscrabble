name: Build

on: [push, pull_request]

# docs/02 section 11.1: every step is blocking.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Core has no engine imports (ET-Q-06)
        run: bash tools/check-core-imports.sh

      - name: Clean-room and hand-written JSON checks (ET-Q-07, ENF-QUA-01)
        run: bash tools/check-cleanroom.sh

      - name: Build and unit tests
        run: ./gradlew build

      - name: Generated data is up to date (ET-Q-05)
        run: |
          ./gradlew runData
          git diff --exit-code src/generated
          test -z "$(git status --porcelain src/generated)" || { git status --porcelain src/generated; exit 1; }

      - name: GameTests (ENF-QUA-02)
        run: |
          ./gradlew runGameTestServer
          grep -a "required tests passed" run-gametest/logs/latest.log

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/*.jar
